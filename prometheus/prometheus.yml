global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'bean_api'
    # If API is running on host machine and Prometheus in Docker, use host.docker.internal:8000
    static_configs:
      - targets: ['host.docker.internal:8000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
